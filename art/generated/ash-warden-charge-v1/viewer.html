<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Charge V1 — South pilot review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#15232b;color:#f0e6ce;font:13px Consolas,monospace}header{display:flex;gap:10px;flex-wrap:wrap;padding:8px;align-items:center}select,button,input{font:inherit}input{width:80px}canvas{display:block;image-rendering:pixelated}p{margin:0;padding:6px;background:#4b3528}a{color:#ffc971}@media(max-width:900px){body{font-size:11px}header{gap:5px;padding:4px}}</style>
<header><a href="../ash-warden-locomotion-rd-01/viewer.html">← Принятый пакет</a><strong>Charge V1 · South pilot</strong><select id="direction"><option>South</option><option disabled>East — не создан</option><option disabled>West — не создан</option><option disabled>North — не создан</option></select><select id="mode"><option value="full">Full Charge Sequence</option><option value="idle">Idle</option><option value="walk">Walk</option><option value="melee">Basic Melee B</option><option value="chargeWindup">Charge Windup</option><option value="chargeTravel">Charge Travel</option><option value="chargeBrake">Charge Brake</option></select><button id="play">Пауза</button><button id="restart">Начало</button><label>Темп <select id="rate"><option>1</option><option>0.5</option><option>0.25</option><option>2</option></select></label><label>Кадр <input id="frame" type="range" value="0" min="0" max="13"></label><label><input id="travel" type="checkbox" checked>Фон Travel</label><span id="status"></span></header>
<p id="notice">НЕ ГОТОВО К ПРИЁМКЕ V1: слабая подготовка и опорное торможение. Фазы и события предварительные. Другие направления остановлены после South gate.</p><canvas id="view"></canvas><script src="pilot-data.js"></script><script>
const meta=globalThis.CHARGE_PILOT,canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),ui=Object.fromEntries(['mode','play','restart','rate','frame','travel','status'].map(id=>[id,document.getElementById(id)]));
let index=0,elapsed=0,last=0,playing=true,distance=0,raf,done=false;const images={},clips={...meta.clips},events=[];
const accepted='../ash-warden-directional-melee-b-v1/south/';
for(const [name,count,ms]of [['idle',4,450],['walk',8,64],['melee',12,100]])clips[name]={frames:Array.from({length:count},(_,i)=>accepted+name+'/frames/'+String(i).padStart(2,'0')+'.png'),durationsMs:Array(count).fill(ms),loop:true};
clips.melee.durationsMs=[80,80,90,100,110,80,110,150,100,100,100,100];
for(const clip of Object.values(meta.clips))clip.frames=clip.frames.map(p=>'../../../'+p);
clips.full={frames:[clips.idle.frames[0],...Object.values(meta.clips).flatMap(c=>c.frames),clips.idle.frames[0]],durationsMs:[450,...Object.values(meta.clips).flatMap(c=>c.durationsMs),450]};
const clip=()=>clips[ui.mode.value];
function reset(){index=0;elapsed=0;last=0;distance=0;done=false;events.length=0;ui.frame.max=clip().frames.length-1;}
function phase(){if(ui.mode.value!=='full')return ui.mode.value;return index===0||index===13?'idle':index<=4?'chargeWindup':index<=8?'chargeTravel':'chargeBrake';}
function draw(){const h=canvas.height,w=canvas.width,s=meta.worldScale*(w<900?1.8:2.6),baseline=h*.76;ctx.imageSmoothingEnabled=false;ctx.fillStyle='#273a35';ctx.fillRect(0,0,w,h);const tile=40,dy=distance%tile;ctx.strokeStyle='#3d5142';for(let y=-tile+dy;y<h;y+=tile){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}for(let x=0;x<w;x+=tile){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}for(const [im,x,label]of [[images[clips.idle.frames[0]],w*.28,'Принятый Idle'],[images[clip().frames[index]],w*.68,phase()+' #'+index]]){ctx.drawImage(im,Math.round(x-96*s),Math.round(baseline-154*s),Math.round(192*s),Math.round(192*s));ctx.fillStyle='#fff0d2';ctx.textAlign='center';ctx.fillText(label,x,baseline+28);}ui.frame.value=index;ui.status.textContent=phase()+' · '+index+' · '+(done?'Idle / конец':playing?'play':'pause');}
function resize(){canvas.width=innerWidth;canvas.height=Math.max(100,innerHeight-document.querySelector('header').offsetHeight-document.querySelector('p').offsetHeight);draw();}
function tick(t){const dt=last?Math.min(100,t-last):0;last=t;if(playing){const scaled=dt*Number(ui.rate.value);if(ui.travel.checked&&phase()==='chargeTravel')distance+=scaled*.32;elapsed+=scaled;while(playing&&elapsed>=clip().durationsMs[index]){elapsed-=clip().durationsMs[index];if(index+1===clip().frames.length){if(clip().loop)index=0;else{playing=false;done=true;elapsed=0;break;}}else index++;if(ui.mode.value==='full'){const time=clip().durationsMs.slice(0,index).reduce((a,b)=>a+b,0)-450;events.push(...meta.events.filter(e=>e.timeMs===time).map(e=>e.name));}}}draw();raf=requestAnimationFrame(tick);}
ui.play.onclick=()=>{playing=!playing;ui.play.textContent=playing?'Пауза':'Пуск';};ui.restart.onclick=()=>{reset();playing=true;};ui.mode.onchange=()=>{reset();playing=true;};ui.frame.oninput=()=>{playing=false;index=Number(ui.frame.value);elapsed=0;done=false;};ui.rate.onchange=()=>{elapsed=0;};window.addEventListener('resize',resize);window.addEventListener('pagehide',()=>cancelAnimationFrame(raf));document.addEventListener('visibilitychange',()=>{last=0;});
globalThis.chargeReviewState=()=>({index,phase:phase(),done,playing,distance,events:[...events],approved:false});
(async()=>{for(const p of new Set(Object.values(clips).flatMap(c=>c.frames))){const im=new Image();im.src=p;await im.decode();images[p]=im;}reset();resize();raf=requestAnimationFrame(tick);})().catch(e=>{ui.status.textContent=e.message;throw e;});
</script></html>
